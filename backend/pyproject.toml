[project]
name = "satquery-backend"
version = "0.1.0"
description = "SatQuery AI backend — agentic remote-sensing analysis orchestrator"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "psycopg2-binary>=2.9; sys_platform != 'emscripten'",
    "redis>=5.0",
    "celery>=5.4",
    "python-multipart>=0.0.9",
    "numpy>=1.26",
    "opencv-python-headless>=4.10",
    "pillow>=10.4",
    "matplotlib>=3.9",
    "rasterio>=1.3",
    "shapely>=2.0",
    "geopandas>=1.0",
    "pyproj>=3.6",
    "reportlab>=4.2",
    "minio>=7.2",
    "httpx>=0.27",
    "python-jose[cryptography]>=3.3",
    "structlog>=24.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
    "ruff>=0.6",
    "black>=24.8",
    "mypy>=1.11",
]
ml = [
    "torch>=2.3",
    "transformers>=4.44",
    "peft>=0.12",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
